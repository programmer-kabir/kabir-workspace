services:
  streamvault-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: streamvault-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_ENGINE=mongodb
      - MONGODB_URI=mongodb+srv://<username>:<password>@<cluster>.mongodb.net/StreamVault?retryWrites=true&w=majority&appName=StreamVault
      - JWT_SECRET=change_me_to_a_secure_64_character_hex_or_string_in_production
      - COOKIE_DOMAIN=streamvault.io
      - CORS_ORIGIN=https://streamvault.io,https://app.streamvault.io
      - FRONTEND_URL=https://app.streamvault.io
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=300
    volumes:
      - streamvault-downloads:/app/downloads
      - streamvault-temp:/app/temp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  streamvault-downloads:
  streamvault-temp:
