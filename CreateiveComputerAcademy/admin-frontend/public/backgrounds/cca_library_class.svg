<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="libBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="50%" stop-color="#141822"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shelfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Wall Background -->
  <rect width="1920" height="1080" fill="url(#libBg)"/>

  <!-- Warm Downlight Cones -->
  <polygon points="400,0 200,800 600,800" fill="url(#warmLight)"/>
  <polygon points="1520,0 1320,800 1720,800" fill="url(#warmLight)"/>

  <!-- Bookshelves Left -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="360" height="720" rx="8" fill="url(#shelfGrad)" stroke="#374151" stroke-width="2"/>
    <!-- Shelf Dividers -->
    <line x1="0" y1="180" x2="360" y2="180" stroke="#4b5563" stroke-width="6"/>
    <line x1="0" y1="360" x2="360" y2="360" stroke="#4b5563" stroke-width="6"/>
    <line x1="0" y1="540" x2="360" y2="540" stroke="#4b5563" stroke-width="6"/>
    <!-- Stylized Book Spines -->
    <rect x="30" y="40" width="22" height="135" fill="#38bdf8" rx="3" opacity="0.8"/>
    <rect x="56" y="20" width="28" height="155" fill="#f59e0b" rx="3" opacity="0.8"/>
    <rect x="88" y="50" width="18" height="125" fill="#10b981" rx="3" opacity="0.8"/>
    <rect x="110" y="30" width="30" height="145" fill="#6366f1" rx="3" opacity="0.8"/>
    <rect x="144" y="60" width="24" height="115" fill="#ec4899" rx="3" opacity="0.8"/>
    <rect x="172" y="35" width="26" height="140" fill="#e2e8f0" rx="3" opacity="0.8"/>
    <!-- Shelf 2 Books -->
    <rect x="40" y="220" width="32" height="135" fill="#f43f5e" rx="3" opacity="0.75"/>
    <rect x="76" y="200" width="24" height="155" fill="#0ea5e9" rx="3" opacity="0.75"/>
    <rect x="104" y="240" width="20" height="115" fill="#eab308" rx="3" opacity="0.75"/>
  </g>

  <!-- Modern Whiteboard / Academy Crest Board Center-Right -->
  <g transform="translate(1100, 180)">
    <rect x="0" y="0" width="560" height="340" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="3"/>
    <circle cx="120" cy="170" r="55" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <path d="M 120 135 A 35 35 0 1 0 148 185" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="120" cy="170" r="14" fill="#f59e0b"/>
    <text x="210" y="150" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#f1f5f9">CREATIVE</text>
    <text x="210" y="180" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#38bdf8">COMPUTER ACADEMY</text>
    <text x="210" y="210" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#94a3b8" letter-spacing="2">DIGITAL FOUNDATIONS LAB</text>
  </g>

  <!-- Clean Wooden Study Table Base -->
  <rect x="0" y="920" width="1920" height="160" fill="#18130f"/>
  <rect x="0" y="910" width="1920" height="10" fill="#3b261a"/>
</svg>
