<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c2b"/>
      <stop offset="50%" stop-color="#0f121d"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1c13"/>
      <stop offset="50%" stop-color="#1f130d"/>
      <stop offset="100%" stop-color="#150c08"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Wall Background -->
  <rect width="1920" height="1080" fill="url(#wallGrad)"/>

  <!-- Large Frosted Executive Window Left -->
  <rect x="80" y="60" width="580" height="880" rx="16" fill="url(#windowGrad)" stroke="#334155" stroke-width="4"/>
  <!-- Window mullions -->
  <line x1="370" y1="60" x2="370" y2="940" stroke="#334155" stroke-width="4"/>
  <line x1="80" y1="500" x2="660" y2="500" stroke="#334155" stroke-width="4"/>
  <!-- Distant City Lights / Bokeh -->
  <circle cx="200" cy="300" r="40" fill="#38bdf8" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="480" cy="400" r="50" fill="#f59e0b" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="300" cy="650" r="35" fill="#a855f7" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Vertical Luxury Acoustic Wood Slats Right Wall -->
  <g opacity="0.6">
    <rect x="1350" y="0" width="22" height="1080" fill="url(#woodGrad)"/>
    <rect x="1390" y="0" width="22" height="1080" fill="url(#woodGrad)"/>
    <rect x="1430" y="0" width="22" height="1080" fill="url(#woodGrad)"/>
    <rect x="1470" y="0" width="22" height="1080" fill="url(#woodGrad)"/>
    <rect x="1510" y="0" width="22" height="1080" fill="url(#woodGrad)"/>
    <rect x="1550" y="0" width="22" height="1080" fill="url(#woodGrad)"/>
    <rect x="1590" y="0" width="22" height="1080" fill="url(#woodGrad)"/>
    <rect x="1630" y="0" width="22" height="1080" fill="url(#woodGrad)"/>
    <rect x="1670" y="0" width="22" height="1080" fill="url(#woodGrad)"/>
    <rect x="1710" y="0" width="22" height="1080" fill="url(#woodGrad)"/>
    <rect x="1750" y="0" width="22" height="1080" fill="url(#woodGrad)"/>
    <rect x="1790" y="0" width="22" height="1080" fill="url(#woodGrad)"/>
    <rect x="1830" y="0" width="22" height="1080" fill="url(#woodGrad)"/>
    <rect x="1870" y="0" width="22" height="1080" fill="url(#woodGrad)"/>
  </g>

  <!-- CCA Academy Glass Wall Plaque with Backlight (Center Right) -->
  <g transform="translate(1000, 160)">
    <!-- Plaque Backlight Glow -->
    <rect x="-20" y="-20" width="440" height="260" rx="24" fill="#fbbf24" opacity="0.08" filter="url(#softGlow)"/>
    <!-- Glass Plaque Base -->
    <rect x="0" y="0" width="400" height="220" rx="18" fill="#1e293b" fill-opacity="0.75" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2"/>
    <!-- CCA Emblem -->
    <circle cx="90" cy="110" r="50" fill="url(#goldGrad)" opacity="0.2"/>
    <circle cx="90" cy="110" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <path d="M 90 78 A 32 32 0 1 0 118 122" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="90" cy="110" r="12" fill="url(#goldGrad)"/>
    <!-- Typography -->
    <text x="160" y="95" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="1">CREATIVE</text>
    <text x="160" y="125" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="url(#goldGrad)" letter-spacing="2">COMPUTER</text>
    <text x="160" y="152" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#94a3b8" letter-spacing="4">ACADEMY</text>
  </g>

  <!-- Warm Floor Ambient Base -->
  <rect x="0" y="960" width="1920" height="120" fill="#0b0e14"/>
  <line x1="0" y1="960" x2="1920" y2="960" stroke="#1e293b" stroke-width="2"/>
</svg>
