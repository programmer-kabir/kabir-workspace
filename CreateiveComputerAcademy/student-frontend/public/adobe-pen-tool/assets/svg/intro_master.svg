<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 640 360" enable-background="new 0 0 640 360" xml:space="preserve">

<defs>
	<!-- Button Gradient -->
	<linearGradient id="btn_grad" gradientUnits="userSpaceOnUse" x1="456" y1="255" x2="529" y2="291">
		<stop offset="0%" stop-color="#FF5722"/>
		<stop offset="100%" stop-color="#FF9800"/>
	</linearGradient>

	<!-- Button Hover Glow -->
	<linearGradient id="btn_go_grad" gradientUnits="userSpaceOnUse" x1="456" y1="255" x2="529" y2="291">
		<stop offset="0%" stop-color="#00C853"/>
		<stop offset="100%" stop-color="#64DD17"/>
	</linearGradient>

	<!-- Planet Gradient -->
	<radialGradient id="planet_grad" cx="40%" cy="25%" r="75%">
		<stop offset="0%" stop-color="#FF7043"/>
		<stop offset="40%" stop-color="#E64A19"/>
		<stop offset="80%" stop-color="#BF360C"/>
		<stop offset="100%" stop-color="#3E0E02"/>
	</radialGradient>

	<!-- Planet Ring Gradient -->
	<linearGradient id="ring_grad" x1="0%" y1="0%" x2="100%" y2="100%">
		<stop offset="0%" stop-color="#FFE082" stop-opacity="0.85"/>
		<stop offset="50%" stop-color="#FFB74D" stop-opacity="0.4"/>
		<stop offset="100%" stop-color="#FF8A65" stop-opacity="0.1"/>
	</linearGradient>

	<!-- Visor Gradient -->
	<linearGradient id="visor_grad" x1="0%" y1="0%" x2="0%" y2="100%">
		<stop offset="0%" stop-color="#00E5FF"/>
		<stop offset="100%" stop-color="#0091EA"/>
	</linearGradient>

	<!-- Star Symbols -->
	<symbol id="star_cross" viewBox="-8 -8 16 16">
		<path fill="#FFFFFF" opacity="0.85" d="M0,-8 L1.5,-2 L7.5,-2 L2.5,1.5 L4.5,7.5 L0,3.5 L-4.5,7.5 L-2.5,1.5 L-7.5,-2 L-1.5,-2 Z"/>
	</symbol>
	<symbol id="star_dot" viewBox="-3 -3 6 6">
		<circle cx="0" cy="0" r="2" fill="#E1BEE7" opacity="0.75"/>
	</symbol>
	<symbol id="star_diamond" viewBox="-5 -5 10 10">
		<polygon points="0,-5 4,0 0,5 -4,0" fill="#80D8FF" opacity="0.8"/>
	</symbol>
</defs>

<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- BACKGROUND & ENVIRONMENT                                                -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<g id="background">
	<!-- Transparent boundary rect to preserve group dimensions -->
	<rect id="gradient" x="0" y="0" fill="none" width="640" height="360"/>

	<!-- Cosmic Stars & Nebulae -->
	<use xlink:href="#star_cross" x="35" y="45" width="12" height="12"/>
	<use xlink:href="#star_cross" x="180" y="25" width="14" height="14"/>
	<use xlink:href="#star_cross" x="380" y="30" width="10" height="10"/>
	<use xlink:href="#star_cross" x="520" y="45" width="15" height="15"/>
	<use xlink:href="#star_cross" x="610" y="80" width="12" height="12"/>
	<use xlink:href="#star_cross" x="600" y="220" width="13" height="13"/>

	<use xlink:href="#star_diamond" x="80" y="55" width="8" height="8"/>
	<use xlink:href="#star_diamond" x="290" y="40" width="9" height="9"/>
	<use xlink:href="#star_diamond" x="460" y="25" width="8" height="8"/>
	<use xlink:href="#star_diamond" x="580" y="150" width="9" height="9"/>

	<use xlink:href="#star_dot" x="50" y="90" width="4" height="4"/>
	<use xlink:href="#star_dot" x="230" y="60" width="5" height="5"/>
	<use xlink:href="#star_dot" x="340" y="20" width="4" height="4"/>
	<use xlink:href="#star_dot" x="500" y="70" width="5" height="5"/>
	<use xlink:href="#star_dot" x="625" y="160" width="4" height="4"/>
	<use xlink:href="#star_dot" x="570" y="310" width="5" height="5"/>

	<!-- Soft Ambient Nebulae -->
	<circle cx="510" cy="80" r="90" fill="#7C4DFF" opacity="0.08"/>
	<circle cx="110" cy="70" r="70" fill="#00E5FF" opacity="0.06"/>

	<!-- ── CELESTIAL PLANET (NATURAL ORGANIC CURVE, NO FLAT CUT) ─── -->
	<g id="planet_group">
		<!-- Main Planet Sphere with smooth organic horizon -->
		<circle cx="130" cy="400" r="175" fill="url(#planet_grad)"/>
		<!-- Shadow hemisphere -->
		<path d="M 295,360 A 175,175 0 0,1 130,575 A 175,175 0 0,1 -30,440 A 175,175 0 0,0 295,360 Z" fill="#1C0602" opacity="0.65"/>
		<!-- Planetary Ring -->
		<ellipse cx="130" cy="390" rx="230" ry="36" fill="none" stroke="url(#ring_grad)" stroke-width="13" opacity="0.45" transform="rotate(-15 130 390)"/>
		<!-- Atmosphere Rim Glow -->
		<circle cx="130" cy="400" r="175" fill="none" stroke="#FFAB91" stroke-width="2.5" opacity="0.6"/>
	</g>

	<!-- ── MASCOT: LUMI & PEN ROBOT ────────────────────────────────── -->
	<g id="weber">
		<!-- Ground Shadows -->
		<ellipse cx="160" cy="324" rx="22" ry="5.5" fill="#1B0602" opacity="0.75"/>
		<ellipse cx="98" cy="324" rx="32" ry="6.5" fill="#1B0602" opacity="0.75"/>

		<!-- Lumi the Space Cadet -->
		<g id="lumi_character">
			<!-- Jetpack -->
			<rect x="138" y="270" width="8" height="24" rx="4" fill="#37474F"/>
			<rect x="140" y="266" width="4" height="4" rx="1" fill="#FF5722"/>

			<!-- Legs -->
			<rect x="149" y="306" width="7" height="16" rx="3" fill="#ECEFF1"/>
			<rect x="162" y="306" width="7" height="16" rx="3" fill="#ECEFF1"/>
			<!-- Boots -->
			<path d="M147,318 h11 a3,3 0 0,1 3,3 v2 h-16 v-3 a2,2 0 0,1 2,-2 z" fill="#263238"/>
			<path d="M160,318 h11 a3,3 0 0,1 3,3 v2 h-16 v-3 a2,2 0 0,1 2,-2 z" fill="#263238"/>

			<!-- Torso / Spacesuit -->
			<rect x="145" y="274" width="28" height="34" rx="8" fill="#FFFFFF"/>
			<!-- Chest Control Panel -->
			<rect x="151" y="281" width="16" height="14" rx="3" fill="#00BCD4" opacity="0.2"/>
			<circle cx="155" cy="288" r="2.2" fill="#00E5FF"/>
			<circle cx="162" cy="288" r="2.2" fill="#FF9800"/>
			<!-- Belt -->
			<rect x="145" y="302" width="28" height="4" fill="#37474F"/>
			<rect x="156" y="301" width="6" height="6" rx="1" fill="#FFC107"/>

			<!-- Arms -->
			<path d="M145,278 c-4,6 -6,14 -4,19 c1,2 3,2 4,1 c1,-4 3,-12 5,-17 z" fill="#ECEFF1"/>
			<!-- Waving Hand -->
			<path d="M173,278 c5,3 10,7 13,11 c2,2 0,4 -2,3 c-4,-3 -8,-7 -11,-11 z" fill="#ECEFF1"/>
			<circle cx="185" cy="291" r="3.5" fill="#263238"/>

			<!-- Helmet -->
			<circle cx="159" cy="261" r="17" fill="#FFFFFF"/>
			<circle cx="159" cy="261" r="17" fill="none" stroke="#CFD8DC" stroke-width="1.5"/>
			<!-- Helmet Antenna -->
			<line x1="159" y1="244" x2="159" y2="238" stroke="#B0BEC5" stroke-width="2"/>
			<circle cx="159" cy="237" r="3" fill="#FF5722"/>
			<circle cx="159" cy="237" r="5" fill="none" stroke="#FF9800" opacity="0.6"/>

			<!-- Visor Glass with Happy Smile -->
			<rect x="147" y="252" width="24" height="17" rx="8" fill="url(#visor_grad)"/>
			<ellipse cx="153" cy="259" rx="2.5" ry="3.5" fill="#FFFFFF"/>
			<ellipse cx="165" cy="259" rx="2.5" ry="3.5" fill="#FFFFFF"/>
			<path d="M156,264 Q159,267 162,264" fill="none" stroke="#00363A" stroke-width="1.5" stroke-linecap="round"/>
			<!-- Visor Reflection -->
			<path d="M149,255 A 6,6 0 0,1 167,255" fill="none" stroke="#E0F7FA" stroke-width="1.5" opacity="0.8"/>
		</g>

		<!-- Pen Tool Robot Companion -->
		<g id="pen_robot">
			<!-- Tripod Stand Legs -->
			<line x1="82" y1="301" x2="72" y2="322" stroke="#455A64" stroke-width="3.5" stroke-linecap="round"/>
			<line x1="120" y1="301" x2="130" y2="322" stroke="#455A64" stroke-width="3.5" stroke-linecap="round"/>
			<line x1="101" y1="303" x2="101" y2="323" stroke="#37474F" stroke-width="3.5" stroke-linecap="round"/>

			<!-- Pen Tool Body -->
			<path d="M145,259 c0,0 -37,-15 -37,-32 l-10,0 l-11,0 c0,17 -37,32 -37,32 l19,45 l14,0 l18,0 l15,0 l19,-45 z" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="1.5"/>

			<!-- Metallic Nib Collar -->
			<path d="M79,274 L123,274 L117,302 L85,302 Z" fill="#ECEFF1"/>
			<line x1="101" y1="274" x2="101" y2="302" stroke="#B0BEC5" stroke-width="1.5"/>

			<!-- Nib Eye & Slit -->
			<path d="M101,250 l0,-14 c0,-0.3 -0.3,-0.6 -0.6,-0.6 h-3.7 c-0.3,0 -0.6,0.3 -0.6,0.6 l0,14 c-8,1.2 -13.4,7.8 -13.4,15.7 c0,8.8 7.1,15.9 15.9,15.9 c8.8,0 15.9,-7.1 15.9,-15.9 C113.4,257.8 108,251.2 101,250 z" fill="#1A1035"/>
			<circle cx="99" cy="266" r="5" fill="#00E5FF"/>
			<circle cx="100.5" cy="264.5" r="1.5" fill="#FFFFFF"/>

			<!-- Glowing Orange Ring -->
			<rect x="91" y="227" width="20" height="3" rx="1.5" fill="#FF5722"/>
		</g>
	</g>

	<!-- ── MODERN CYBER DIALOGUE CARD ──────────────────────────────── -->
	<g id="lumpy_speech_bubble">
		<!-- Frosted Cyber Card -->
		<rect x="195" y="85" width="425" height="158" rx="20" fill="#0F0521" fill-opacity="0.8" stroke="#7C4DFF" stroke-opacity="0.4" stroke-width="1.5"/>
		<rect x="197" y="87" width="421" height="154" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
		<!-- Speech Tail pointing toward Lumi -->
		<polygon points="196,190 176,210 196,204" fill="#0F0521" fill-opacity="0.8"/>
		<path d="M196,190 L176,210 L196,204" fill="none" stroke="#7C4DFF" stroke-opacity="0.4" stroke-width="1.5"/>
		<!-- Cyber Badge Tag -->
		<rect x="218" y="99" width="132" height="18" rx="9" fill="#7C4DFF" fill-opacity="0.25" stroke="#7C4DFF" stroke-opacity="0.5" stroke-width="1"/>
		<text x="284" y="111.5" text-anchor="middle" fill="#00E5FF" font-family="Arial, -apple-system, sans-serif" font-size="9" font-weight="bold" letter-spacing="0.8">✦ CCA VECTOR ODYSSEY</text>
	</g>

	<!-- ── BASE NEXT BUTTON (EXACT CLICK RECT: 456, 255, 73, 36) ───── -->
	<g id="nextbutton">
		<rect id="buttonshadow" x="456" y="258" width="73" height="36" rx="14" fill="#000000" opacity="0.5"/>
		<rect id="buttonrect" x="456" y="255" width="73" height="36" rx="14" fill="url(#btn_grad)" stroke="#FFA726" stroke-width="1.5"/>
	</g>
</g>

<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- SCENE 001: WELCOME & INTRO                                              -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<g id="scene001" display="inline">
	<!-- Next Button Label -->
	<rect x="456" y="255" fill="none" width="73" height="36"/>
	<text x="492.5" y="278" text-anchor="middle" fill="#FFFFFF" font-family="Arial, -apple-system, sans-serif" font-size="14" font-weight="900" letter-spacing="1">NEXT</text>

	<!-- Dialogue Text -->
	<text x="218" y="145" fill="#FFD54F" font-family="Arial, -apple-system, sans-serif" font-size="17" font-weight="bold" letter-spacing="0.5">HI! I'M LUMI</text>
	<text x="218" y="170" fill="#FFFFFF" font-family="Arial, -apple-system, sans-serif" font-size="14" font-weight="500">I am your space vector navigator!</text>
	<text x="218" y="192" fill="#B0BEC5" font-family="Arial, -apple-system, sans-serif" font-size="12" font-weight="normal">Click NEXT to learn how to guide our ship.</text>

	<!-- Straight Line Demo Path -->
	<line fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,4" x1="218" y1="216" x2="440" y2="216"/>
	<circle cx="218" cy="216" r="4.5" fill="#FF5722" stroke="#FFFFFF" stroke-width="1.5"/>
	<g transform="translate(442, 204)">
		<path d="M0,12 L14,0 L24,5 L14,19 Z" fill="#FFFFFF" stroke="#00E5FF" stroke-width="1"/>
		<circle cx="16" cy="8" r="2.5" fill="#00E5FF"/>
		<polygon points="0,12 -5,12 0,16" fill="#FF5722"/>
	</g>
</g>

<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- SCENE 002: LOST IN SPACE                                                -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<g id="scene002" display="none">
	<!-- Next Button -->
	<g id="next_button_1_">
		<rect x="456" y="258" width="73" height="36" rx="14" fill="#000000" opacity="0.5"/>
		<rect x="456" y="255" width="73" height="36" rx="14" fill="url(#btn_grad)" stroke="#FFA726" stroke-width="1.5"/>
		<text x="492.5" y="278" text-anchor="middle" fill="#FFFFFF" font-family="Arial, -apple-system, sans-serif" font-size="14" font-weight="900" letter-spacing="1">NEXT</text>
	</g>

	<!-- Dialogue Text -->
	<text x="218" y="145" fill="#FF7043" font-family="Arial, -apple-system, sans-serif" font-size="16" font-weight="bold" letter-spacing="0.5">WE ARE ENTERING UNCHARTED SPACE!</text>
	<text x="218" y="170" fill="#FFFFFF" font-family="Arial, -apple-system, sans-serif" font-size="14" font-weight="500">Asteroid fields require sharp precision.</text>
	<text x="218" y="192" fill="#B0BEC5" font-family="Arial, -apple-system, sans-serif" font-size="12" font-weight="normal">Master Bézier curves to steer smoothly through tunnels.</text>

	<!-- Wavy Demo Path -->
	<path fill="none" stroke="#7C4DFF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,4"
		d="M 218,218 C 260,195 300,235 340,210 C 380,185 410,230 450,205"/>
	<circle cx="218" cy="218" r="4.5" fill="#00E5FF" stroke="#FFFFFF" stroke-width="1.5"/>
	<circle cx="340" cy="210" r="4.5" fill="#FFD54F" stroke="#FFFFFF" stroke-width="1.5"/>
	<circle cx="450" cy="205" r="4.5" fill="#FF5722" stroke="#FFFFFF" stroke-width="1.5"/>
</g>

<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- SCENE 003: READY TO LAUNCH                                              -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<g id="scene003" display="none">
	<!-- GO! Button -->
	<rect x="456" y="258" width="73" height="36" rx="14" fill="#000000" opacity="0.5"/>
	<rect x="456" y="255" width="73" height="36" rx="14" fill="url(#btn_go_grad)" stroke="#B9F6CA" stroke-width="1.5"/>
	<text x="492.5" y="278" text-anchor="middle" fill="#003300" font-family="Arial, -apple-system, sans-serif" font-size="15" font-weight="900" letter-spacing="1">GO!</text>

	<!-- Dialogue Text -->
	<text x="218" y="145" fill="#00E5FF" font-family="Arial, -apple-system, sans-serif" font-size="16" font-weight="bold" letter-spacing="0.5">READY TO PILOT THE SHIP?</text>
	<text x="218" y="170" fill="#FFFFFF" font-family="Arial, -apple-system, sans-serif" font-size="14" font-weight="500">Use the Pen Tool to connect each waypoint.</text>
	<text x="218" y="192" fill="#B0BEC5" font-family="Arial, -apple-system, sans-serif" font-size="12" font-weight="normal">Click GO to start your first straight-line mission!</text>

	<!-- Waypoint Nodes & Ship Dock -->
	<g id="bubble-graphic">
		<polyline fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3,4"
			points="218,218 270,218 320,205 375,225 425,210 460,218"/>
		<circle cx="218" cy="218" r="4.5" fill="#FF5722" stroke="#FFFFFF" stroke-width="1.5"/>
		<circle cx="270" cy="218" r="4" fill="#00E5FF" stroke="#FFFFFF" stroke-width="1"/>
		<circle cx="320" cy="205" r="4" fill="#FFD54F" stroke="#FFFFFF" stroke-width="1"/>
		<circle cx="375" cy="225" r="4" fill="#E040FB" stroke="#FFFFFF" stroke-width="1"/>
		<circle cx="425" cy="210" r="4" fill="#69F0AE" stroke="#FFFFFF" stroke-width="1"/>

		<!-- Mini Spaceship Target -->
		<g transform="translate(458, 208)">
			<polygon points="0,10 18,10 24,0 18,-10 0,-10 6,0" fill="#FFFFFF" stroke="#00BCD4" stroke-width="1.5"/>
			<polygon points="6,0 12,0 10,-4 4,-4" fill="#00E5FF"/>
			<polygon points="-4,5 -10,0 -4,-5" fill="#FF5722"/>
		</g>
	</g>
</g>

</svg>
