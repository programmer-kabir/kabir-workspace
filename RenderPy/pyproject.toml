[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "renderpy"
version = "1.1.0"
description = "Convert any pycairo animation script into a 4K MP4, WebM, MOV, or PNG sequence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pycairo>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
renderpy = "renderpy:main"

[tool.setuptools]
py-modules = ["renderpy"]

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["core"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
